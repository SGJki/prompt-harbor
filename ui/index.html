<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Harbor</title><style>
:root{font:14px system-ui;color:#dbe7f5;background:#0b1220}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}.side{width:220px;background:#111c2e;padding:24px 16px}.brand{font-size:20px;font-weight:700;margin-bottom:32px}.brand small{display:block;color:#7f9ab8;font-size:11px}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#9fb3cb;padding:12px;border-radius:7px;cursor:pointer}.nav button.active,.nav button:hover{background:#213653;color:#fff}.main{flex:1;padding:28px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#6f8dab;font-size:11px;letter-spacing:.12em}h1{margin:6px 0 24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#15243a;border:1px solid #243b58;border-radius:10px;padding:18px}.card b{display:block;font-size:28px;margin-top:8px}.panel{margin-top:24px;background:#15243a;border:1px solid #243b58;border-radius:10px;padding:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #263d59}th{color:#89a4c2;font-size:12px}.pill{padding:3px 8px;border-radius:99px;background:#244466;font-size:12px}.ok{background:#18543f}.err{background:#6b2934}@media(max-width:650px){.side{width:70px;padding:18px 8px}.brand{font-size:0}.brand:before{content:'PH';font-size:18px}.brand small{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:20px}.main{padding:18px}}
</style></head><body><aside class="side"><div class="brand">prompt harbor<small>gateway audit desk</small></div><nav class="nav"><button class="active" data-tab="overview">Overview</button><button data-tab="calls">Calls</button><button data-tab="sessions">Sessions</button></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">LOCAL OPERATIONS</div><h1 id="title">Overview</h1></div><button id="refresh">↻ Refresh</button></div><section id="view"></section></main><script>
const view=document.querySelector('#view'),title=document.querySelector('#title');let data={calls:[],sessions:[]},tab='overview';
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let endpoint=tab==='calls'?'/api/calls':tab==='sessions'?'/api/sessions':'/api/overview',r=await fetch(endpoint);if(!r.ok)throw 0;let next=await r.json();if(tab==='calls')data.calls=next.calls||[];else if(tab==='sessions')data.sessions=next.sessions||[];else data=next}catch(e){}render()}
function table(headers,rows){return `<table><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.join('')}</table>`}
function callRows(calls){return calls.map(c=>`<tr class="call-row" data-call-id="${esc(c.id)}"><td>${esc(c.created_at)}</td><td>${esc(c.endpoint)}</td><td>${esc(c.model)}</td><td><span class="pill ${c.status_code>=400?'err':'ok'}">${esc(c.status||c.status_code)}</span></td><td>${esc(c.duration_ms)} ms</td></tr>`)}
async function detail(id){let panel=document.querySelector('#call-detail');if(!panel)return;panel.textContent='Loading…';try{let r=await fetch('/api/calls/'+encodeURIComponent(id));if(!r.ok)throw 0;let c=await r.json();panel.innerHTML=`<h3>Call ${esc(c.id)}</h3><p><b>${esc(c.endpoint)}</b> · ${esc(c.status)} (${esc(c.status_code)}) · ${esc(c.duration_ms)} ms</p><h4>Request headers</h4><pre>${esc(JSON.stringify(c.request_headers_json||{},null,2))}</pre><h4>Request</h4><pre>${esc(c.request_body)}</pre><h4>Response headers</h4><pre>${esc(JSON.stringify(c.response_headers_json||{},null,2))}</pre><h4>Response</h4><pre>${esc(c.response_body)}</pre><h4>Usage</h4><pre>${esc(JSON.stringify({input_tokens:c.input_tokens,output_tokens:c.output_tokens,total_tokens:c.total_tokens},null,2))}</pre>${c.error_message?`<h4>Error</h4><pre>${esc(c.error_type)}: ${esc(c.error_message)}</pre>`:''}`}catch(e){panel.textContent='Unable to load call details.'}}
function render(){let calls=data.calls||[],sessions=data.sessions||[],ok=calls.filter(c=>c.status_code>=200&&c.status_code<400).length;if(tab==='calls'){view.innerHTML=`<div class="panel"><h3>Calls</h3>${table(['Time','Endpoint','Model','Status','Duration'],callRows(calls))}</div><div class="panel" id="call-detail"><p>Select a call to inspect its request and response.</p></div>`;return}if(tab==='sessions'){view.innerHTML=`<div class="panel"><h3>Sessions</h3>${table(['Agent','Project','Working directory','Started','Last seen'],sessions.map(s=>`<tr><td>${esc(s.agent)}</td><td>${esc(s.project_name)}</td><td>${esc(s.cwd)}</td><td>${esc(s.started_at)}</td><td>${esc(s.last_seen_at)}</td></tr>`))}</div>`;return}view.innerHTML=`<div class="cards"><div class="card">Total calls<b>${calls.length}</b></div><div class="card">Success rate<b>${calls.length?Math.round(ok/calls.length*100):0}%</b></div><div class="card">Sessions<b>${sessions.length}</b></div></div><div class="panel"><h3>Recent calls</h3>${table(['Time','Endpoint','Model','Status','Duration'],callRows(calls.slice(0,20)))}</div>`}
view.addEventListener('click',e=>{let row=e.target.closest('.call-row');if(row)detail(row.dataset.callId)});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;title.textContent=b.textContent;load()});document.querySelector('#refresh').onclick=load;load();setInterval(load,5000);try{const es=new EventSource('/api/events');es.addEventListener('invalidate',load);es.onerror=()=>es.close()}catch(e){}
</script></body></html>
